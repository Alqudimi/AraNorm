# Release pipeline — builds, verifies, and publishes AraNorm to PyPI.
#
# Trigger: push a version tag  →  git tag v1.15.0 && git push origin v1.15.0
#
# One-time setup (Trusted Publishing, no tokens or secrets needed):
#   1. PyPI → https://pypi.org/manage/account/publishing/
#   2. Add a trusted publisher:
#        PyPI project name : aranorm
#        Owner             : Alqudimi
#        Repository        : AraNorm
#        Workflow name     : release.yml
#        Environment name  : pypi
#   3. GitHub → repo Settings → Environments → New environment → name it "pypi"
#      (optionally require manual approval for an extra release gate)
#
# The pipeline then:
#   build          → sdist + wheel, twine metadata check
#   verify-artifacts → install wheel & sdist in isolation, run smoke contracts
#   publish-to-pypi  → OIDC trusted publishing (PEP 740 attestations included)
#   github-release   → GitHub Release with the built artifacts attached

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  verify-artifacts:
    name: Verify built artifacts
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Install quality dependencies (for the smoke suite)
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e ".[quality]"

      - name: Run installed-artifact smoke contracts
        run: python -m pytest tests/test_installed_smoke.py -q

  publish-to-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish on tag pushes
    needs: [build, verify-artifacts]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aranorm
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the release
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate-release-notes: true
