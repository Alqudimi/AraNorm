[flake8]
max-line-length = 120
extend-ignore = E203, W503, W504
per-file-ignores =
    # Allow unused imports in __init__ re-export files
    src/aranorm/__init__.py: F401
    src/aranorm/core/__init__.py: F401
    src/aranorm/processors/__init__.py: F401
    src/aranorm/utils/__init__.py: F401
    src/aranorm/analysis/__init__.py: F401
    src/aranorm/exceptions/__init__.py: F401
    # Allow long lines in data-definition files
    src/aranorm/utils/root_extractor.py: E501
exclude =
    .git,
    __pycache__,
    .venv,
    build,
    dist,
    *.egg-info
