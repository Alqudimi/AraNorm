# ──────────────────────────────────────────────────────────────────────────────
# AraNorm — Production-grade Arabic text normalization
# Modern PEP 621 / PEP 639 packaging configuration
# ──────────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aranorm"
version = "1.15.0"
description = "Production-grade Arabic text normalization: MSA, dialects, Arabizi, stop words, and 40+ text analyzers — zero mandatory dependencies."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Abdulaziz Mohammed Alqudimi", email = "eng7mi@gmail.com" },
]
maintainers = [
    { name = "Abdulaziz Mohammed Alqudimi", email = "eng7mi@gmail.com" },
]
keywords = [
    "arabic",
    "arabic-nlp",
    "arabic-text",
    "nlp",
    "natural-language-processing",
    "normalization",
    "text-normalization",
    "text-processing",
    "text-cleaning",
    "dialects",
    "arabic-dialects",
    "dialect-identification",
    "coda",
    "msa",
    "arabizi",
    "stop-words",
    "stopwords",
    "text-analysis",
    "sentiment-analysis",
    "keyword-extraction",
    "readability",
    "tokenizer",
    "stemming",
    "preprocessing",
    "machine-learning",
    "linguistics",
    "computational-linguistics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Alqudimi/AraNorm"
Repository = "https://github.com/Alqudimi/AraNorm"
"Bug Tracker" = "https://github.com/Alqudimi/AraNorm/issues"
Documentation = "https://github.com/Alqudimi/AraNorm/tree/main/docs"
Changelog = "https://github.com/Alqudimi/AraNorm/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/Alqudimi/AraNorm/releases"

[project.scripts]
aranorm = "aranorm.cli:main"

# ─── Optional dependencies ────────────────────────────────────────────────────
# The core library (light / standard / deep / social_media presets) is fully
# functional with ZERO third-party dependencies. Install an extra only when you
# need the corresponding capability.
[project.optional-dependencies]
# CAMeL Tools — model-based dialect identification (MADAR corpus, >90% accuracy)
camel = ["camel-tools>=1.5.7"]

# Neural CODA / MSA normalization via HuggingFace Seq2Seq models
ml = [
    "transformers>=5.20.2",
    "torch>=2.14.1",
    "sentencepiece>=0.2.3",
]

# Everything (all integrations + all optional libraries)
full = [
    "camel-tools>=1.5.7",
    "pyarabic>=0.6.15",
    "tnkeeh>=0.0.9",
    "tahdheeb>=0.1.1",
    "transformers>=5.20.2",
    "torch>=2.14.1",
    "sentencepiece>=0.2.3",
    "emoji>=2.16.0",
    "regex>=2026.9.29",
    "tqdm>=4.70.1",
]

# Test & quality toolchain (used by CI)
quality = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.5",
    "black>=26.10.1",
    "flake8>=7.4.1",
    "mypy>=2.4.1",
]

# Full development environment (quality + packaging + release tooling)
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.5",
    "black>=26.10.1",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "build>=1.6.1",
    "twine>=7.0.0",
    "pre-commit>=4.6.2",
]

# ─── setuptools ───────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aranorm = [
    "data/*.json",
    "data/stopwords/*.txt",
    "data/stopwords/domains/*.txt",
    "py.typed",
]

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests requiring optional dependencies",
]

# ─── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/aranorm"]
omit = ["src/aranorm/models/*", "src/aranorm/integrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ─── black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312", "py313"]
skip-string-normalization = false

# ─── isort ────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 120

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = false
ignore_missing_imports = true
