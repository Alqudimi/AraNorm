[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aranorm"
version = "1.15.0"
description = "Production-grade Arabic text normalization pipeline for Modern Standard Arabic and dialects."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Abdulaziz Alqudimi", email = "alqudimi@example.com" },
]
maintainers = [
    { name = "Abdulaziz Alqudimi", email = "alqudimi@example.com" },
]
keywords = [
    "arabic",
    "nlp",
    "normalization",
    "dialects",
    "coda",
    "arabizi",
    "text-processing",
    "arabic-nlp",
    "natural-language-processing",
    "arabic-text",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Alqudimi/AraNorm"
Repository = "https://github.com/Alqudimi/AraNorm"
"Bug Tracker" = "https://github.com/Alqudimi/AraNorm/issues"
Documentation = "https://github.com/Alqudimi/AraNorm/blob/main/docs/API.md"
Changelog = "https://github.com/Alqudimi/AraNorm/blob/main/CHANGELOG.md"

[project.scripts]
aranorm = "aranorm.cli:main"

[project.optional-dependencies]
camel = ["camel-tools>=1.5.0"]
ml = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
]
quality = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
full = [
    "camel-tools>=1.5.0",
    "pyarabic>=0.6.0",
    "tnkeeh>=0.0.9",
    "tahdheeb>=0.1.1",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
    "emoji>=2.0.0",
    "regex>=2023.0.0",
    "tqdm>=4.65.0",
]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aranorm = [
    "data/*.json",
    "data/stopwords/*.txt",
    "data/stopwords/domains/*.txt",
    "py.typed",
]

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests requiring optional dependencies",
]

# ─── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/aranorm"]
omit = ["src/aranorm/models/*", "src/aranorm/integrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ─── black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]
skip-string-normalization = false

# ─── isort ────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 120

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = false
ignore_missing_imports = true

# ─── flake8 (in setup.cfg for compatibility) ──────────────────────────────────
# See setup.cfg or .flake8 for flake8 config
